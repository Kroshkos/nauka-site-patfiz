# Amvera Cloud — Контур 2: сайт мероприятий (статический сайт + Python-сервер)
# Документация: https://amvera.ru/docs
meta:
  module: naumenko-ps/amvera-runtime-python
  runtime: python3.11

setup:
  go: "off"
  nodesource: "off"
  php: "off"
  ruby: "off"
  python: "3.11"
  permissions: regular

build:
  commands:
    - echo "static site, no build needed"

run:
  type: python          # Amvera выполнит: python3 server.py из корня /app
  path: server.py
  shell: false

port: 8080              # сервер слушает переменную окружения PORT
