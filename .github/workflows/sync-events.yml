name: Sync events.json with data.js
on:
  push:
    paths:
      - public/js/data.js
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Regenerate public/events.json from data.js
        run: |
          node -e "
          const fs=require('fs');
          global.window={};
          eval(fs.readFileSync('public/js/data.js','utf8'));
          fs.writeFileSync('public/events.json', JSON.stringify(window.NAUKA_EVENTS,null,1));
          console.log('events:', window.NAUKA_EVENTS.length);
          "
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet public/events.json; then
            git add public/events.json
            git commit -m "chore: синхронизация events.json с данными сайта [skip ci]"
            git push
          else
            echo "No changes"
          fi
